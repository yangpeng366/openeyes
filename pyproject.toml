[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeyes"
version = "0.1.0"
description = "OpenEyes — AI-friendly computer-use primitives for Windows/macOS/Linux"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "yangpeng", email = "yangpeng@sobey.com" },
]
keywords = [
    "computer-use",
    "ai-agent",
    "uia",
    "ui-automation",
    "screenshot",
    "click",
    "mcp",
    "vision",
    "openeyes",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
]
macos = [
    "pyobjc-framework-Cocoa>=10.0",
]
mcp = [
    "mcp>=1.0",
]
vision = [
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
eyes = "openeyes.cli.main:main"
eyes-mcp = "openeyes.mcp.server:main"

[project.urls]
Homepage = "https://github.com/yangpeng366/openeyes"
Issues = "https://github.com/yangpeng366/openeyes/issues"

[tool.setuptools.packages.find]
include = ["openeyes*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
